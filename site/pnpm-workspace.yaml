packages:
  - packages/*
  - apps/*

allowBuilds:
  '@sentry/cli': true
  '@swc/core': true
  esbuild: true
  sharp: true
  unrs-resolver: true

catalog:
  rimraf: ^6.1.3
  typescript: ^5.9.3
  vite: ^6.2.1
  vite-plugin-dts: ^4.5.4
  vitest: ^4.0.18

injectWorkspacePackages: true

minimumReleaseAge: 4320

minimumReleaseAgeExclude:
  - '@next/third-parties'
  - next
  - '@next/bundle-analyzer'
  - eslint-config-next
  - '@next/eslint-plugin-next'
  - '@next/env'
  - react
  - react-dom
  - '@next/swc-*'
