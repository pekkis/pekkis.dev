services:
  directus_database:
    # Pinned by version and digest: upgrades happen when we decide (Dependabot proposes them).
    # Plain Postgres: nothing in the CMS uses PostGIS.
    image: postgres:18.6-alpine3.24@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    restart: unless-stopped
    networks:
      - pekkis
    volumes:
      # Postgres 18 keeps its data in a versioned folder under /var/lib/postgresql.
      - pg18-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: "directus"
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: "directus"
    healthcheck:
      test: ["CMD", "pg_isready", "--host=localhost", "--username=directus"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_interval: 5s
      start_period: 30s

  directus_cache:
    image: redis:8.10.2-alpine@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
    restart: unless-stopped
    networks:
      - pekkis
    healthcheck:
      test: ["CMD-SHELL", "[ $$(redis-cli ping) = 'PONG' ]"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_interval: 5s
      start_period: 30s

  directus:
    networks:
      - pekkis
    image: directus/directus:12.5.1@sha256:ef6fc027605ea659a972356e0c35fd7f88b02118b0b3a322dafbec3cc709fdab
    restart: unless-stopped
    # Caddy proxies to it; Docker bypasses ufw, so bind to localhost only.
    ports:
      - "127.0.0.1:3051:8055"
    depends_on:
      directus_database:
        condition: service_healthy
      directus_cache:
        condition: service_healthy
    volumes:
      - ./uploads:/directus/uploads
      - ./extensions:/directus/extensions
      - ./templates:/directus/templates
    environment:
      DB_CLIENT: "pg"
      DB_HOST: "directus_database"
      DB_PORT: "5432"
      DB_DATABASE: "directus"
      DB_USER: "directus"
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      CACHE_ENABLED: "true"
      CACHE_AUTO_PURGE: "true"
      CACHE_STORE: "redis"
      REDIS: "redis://directus_cache:6379"
      SECRET: ${DIRECTUS_SECRET:?set DIRECTUS_SECRET in .env}
      PUBLIC_URL: "https://cms.pekkis.eu"
      # Behind Caddy: take the client's IP from X-Forwarded-For (Directus 12 defaults to false).
      IP_TRUST_PROXY: "true"
      TELEMETRY: "false"
    healthcheck:
      # /server/health needs authentication since Directus 12; /server/ping is the liveness check.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8055/server/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  pg18-data:

networks:
  pekkis:
    driver: bridge
